
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 320 80"
  fill="none"
>
  <title>Developer Portfolio Icons</title>

  <defs>
    <linearGradient id="accent" x1="12" y1="8" x2="60" y2="64">
      <stop offset="0%" stop-color="#8BCBFF"/>
      <stop offset="100%" stop-color="#438DFF"/>
    </linearGradient>

    <symbol id="developer-mark" viewBox="0 0 64 64">
      <rect
        x="2" y="2" width="60" height="60" rx="15"
        fill="#111318"
        stroke="#343943"
        stroke-width="1.5"
      />
      <path
        d="M25 21 14 32l11 11M39 21l11 11-11 11"
        stroke="#F0F2F5"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="m35 18-6 28"
        stroke="url(#accent)"
        stroke-width="3.5"
        stroke-linecap="round"
      />
    </symbol>

    <symbol id="icon-code" viewBox="0 0 24 24">
      <path
        d="m8 5-7 7 7 7M16 5l7 7-7 7M14 3l-4 18"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </symbol>

    <symbol id="icon-database" viewBox="0 0 24 24">
      <ellipse
        cx="12" cy="5" rx="9" ry="3"
        stroke="currentColor" stroke-width="1.7"
      />
      <path
        d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5
           M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"
        stroke="currentColor" stroke-width="1.7"
      />
    </symbol>

    <symbol id="icon-server" viewBox="0 0 24 24">
      <rect
        x="3" y="3" width="18" height="8" rx="2"
        stroke="currentColor" stroke-width="1.7"
      />
      <rect
        x="3" y="13" width="18" height="8" rx="2"
        stroke="currentColor" stroke-width="1.7"
      />
      <path
        d="M7 7h.01M7 17h.01M11 7h6M11 17h6"
        stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round"
      />
    </symbol>

    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path
        d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"
        stroke="currentColor" stroke-width="1.7"
        stroke-linejoin="round"
      />
      <path
        d="m9 12 2 2 4-4"
        stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </symbol>

    <symbol id="icon-terminal" viewBox="0 0 24 24">
      <rect
        x="2" y="3" width="20" height="18" rx="3"
        stroke="currentColor" stroke-width="1.7"
      />
      <path
        d="m6 9 3 3-3 3M12 15h5"
        stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </symbol>
  </defs>

  <!-- Main portfolio wordmark -->
  <use xlink:href="#developer-mark" width="64" height="64" x="4" y="8"/>

  <g fill="#F0F2F5">
    <text
      x="80" y="39"
      font-family="Inter, system-ui, sans-serif"
      font-size="23"
      font-weight="650"
      letter-spacing="-0.8"
    >ENGINEER</text>

    <text
      x="81" y="56"
      fill="#9BA3B2"
      font-family="Inter, system-ui, sans-serif"
      font-size="10"
      font-weight="500"
      letter-spacing="2.1"
    >BACKEND · SYSTEMS · FINTECH</text>
  </g>
</svg>

