name: Portfolio checks

on:
  pull_request:
    paths:
      - "my-portfolio/**"
      - ".github/workflows/portfolio-checks.yml"
  push:
    branches: [main]
    paths:
      - "my-portfolio/**"
      - ".github/workflows/portfolio-checks.yml"

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-portfolio
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-portfolio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
